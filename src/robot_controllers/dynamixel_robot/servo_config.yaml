# Configuration of the dynamixel servos of the robot, loaded by servo_config.py
#
# Every servo has:
#   name                   what the servo does
#   model                  the dynamixel model (optional)
#   bus                    rs485 or ttl: the connector of the usb adapter it is on, servos on the same bus are read
#                          together
#   mode                   position, extended_position or current_based_position
#   positions: [a, b]      the servo positions (4096 per turn) at the ends of the range, b smaller than a when the
#                          servo is mounted the other way around
#   angles: [a, b]         the joint angles in degrees at those positions, or for the gripper:
#   states: [a, b]         the gripper states at those positions
#   offset                 added to the position, to calibrate the zero point (optional, default 0)
#   goal_current           the most current in mA the servo may use, needed in current_based_position mode
#   profile                velocity and acceleration limit a goal that is far away. With move_time (ms) the servo
#                          interpolates every streamed step over that time (the time-based profile)
#   pid                    the gains p, i and d of the position controller of the servo
#   compensation           gravity (optional, joints 2-5): the holding drive in pwm units per term of the pose,
#                          added to every target as drive * 128 / p positions, at most max_positions. Fitted by
#                          calibration/fit_static_load.py, the terms are in static_compensation.py
#   velocity_feedforward   the lead of a moving joint (optional): the drive in pwm units the motor needs per
#                          degree/s (pwm_per_degree_per_second) and, optional, to overcome friction once it moves
#                          (pwm_for_friction). Every target that is sent with a velocity is shifted ahead by
#                          that drive * 128 / p positions, at most max_positions; nothing is added at rest.
#                          Measured and verified by calibration/tune_servo_gains.py --ff-only
#
# How every value was found, and what was tried before it, is in "Tuning the servo gains.md" under "History of the
# values in servo_config.yaml", and in the two handovers.

# The robot is printed in PLA, which softens around 55-65C. Above the warning temperature a servo is logged, above
# the limit the robot is stopped while all servos still work. The servos shut down by themselves at 80C (70C for the
# gripper) and then go limp.
temperature_warning: 60  # degrees celsius
temperature_limit: 65  # degrees celsius

servos:
  1:
    name: base
    model: XM430-W350
    bus: rs485
    mode: position
    positions: [1024, 3072]
    angles: [0, 180]
    offset: 346  # measured in the jig at 90 degrees, raw 2394
    profile: {velocity: 250, acceleration: 100, move_time: 15}
    # 17 November 2026, after the belt was tightened. This P depends on the belt tension: check the belt first when
    # the base rings
    pid: {p: 2000, i: 0, d: 0}
    velocity_feedforward:  # 21 November 2026, run tune_joint1_20261121_1455
      max_positions: 30
      pwm_per_degree_per_second: 10.54
      pwm_for_friction: 17.1  # 23 November 2026, run tune_joint1_20261123_2305
  2:
    name: shoulder
    model: XM540-W270
    bus: rs485
    mode: position
    positions: [1024, 3072]
    angles: [0, 180]
    offset: -550  # measured in the jig at 0 degrees, raw 474
    profile: {velocity: 500, acceleration: 500, move_time: 15}
    # 20 November 2026: at P 2500 the joint swung while it moved down. The belt tension sets how much P it takes:
    # check the tension before the gains when it swings again
    pid: {p: 2000, i: 0, d: 250}
    # 20 November 2026, at the belt tension of that evening: record again after the belt is retensioned
    compensation:
      max_positions: 15
      terms: {cos_q2: 52.860, sin_phi: 16.153, cos_phi: 0.482, wrist_reach: 1.570}
    velocity_feedforward:  # 21 November 2026, run tune_joint2_20261121_2213
      max_positions: 30
      pwm_per_degree_per_second: 13.97
      pwm_for_friction: 31.6  # 23 November 2026, run tune_joint2_20261123_2307
  3:
    name: elbow
    model: XM430-W350
    bus: rs485
    mode: position
    positions: [3072, 1024]
    angles: [-90, 90]
    profile: {velocity: 150, acceleration: 50, move_time: 15}
    # 26 November 2026: where the upper arm hangs straight down the joint carries no load and floats in its play.
    # There P 4710 D 350 (17 November, tuned with the upper arm loaded) oscillated by itself; 1420 is the highest P
    # that is quiet at rest and settles. Tried with the gamepad, the oscillation is gone. Softer: the friction band
    # at rest is up to 4.3 positions (1.3 before). Not measured again at the loaded poses
    pid: {p: 1420, i: 0, d: 640}
    compensation:  # 19 November 2026
      max_positions: 15
      terms: {constant: 3.904, sin_phi: -108.714, cos_phi: 6.748, wrist_reach: -8.721}
    velocity_feedforward:  # 21 November 2026, run tune_joint3_20261121_2216
      max_positions: 30
      pwm_per_degree_per_second: 3.07
      pwm_for_friction: 48.4  # 23 November 2026, run tune_joint3_20261123_2303
  4:
    name: wrist 1
    model: XC430-W150
    bus: ttl
    mode: position
    positions: [0, 4096]
    angles: [-180, 180]
    offset: 3  # measured in the jig at 0 degrees, raw 2051
    profile: {velocity: 300, acceleration: 100, move_time: 15}
    pid: {p: 780, i: 0, d: 1020}  # 18 November 2026
    # 24 November 2026, fitted on 90 poses at rest (the sweeps at five bends of the wrist give -2.5, -62.7 and
    # +11.5). off_axis is the body of servo 5, which is mounted sideways and rolls with this joint
    compensation:
      max_positions: 15
      terms: {constant: -3.067, wrist_roll: -62.729, off_axis: 9.798}
    velocity_feedforward:  # 21 November 2026, run tune_joint4_20261121_2217
      max_positions: 30
      pwm_per_degree_per_second: 1.45
      pwm_for_friction: 24.8  # 23 November 2026, run tune_joint4_20261123_2230
  # directly on the wrist joint since November 2026, which reversed its direction (hence the reversed positions).
  # The offset has not been checked in the jig since
  5:
    name: wrist 2
    model: XC430-W240
    bus: ttl
    mode: position
    positions: [4096, 0]
    angles: [-180, 180]
    profile: {velocity: 300, acceleration: 100, move_time: 15}
    pid: {p: 760, i: 0, d: 640}  # 17 November 2026
    # 23 November 2026, fitted on 60 poses at rest, NOT on sweeps: the sweeps give constant -12.4 and wrist_pitch
    # -22.4, which holds the joint 1.6 positions too high at rest. Lifting costs this joint more friction than
    # lowering, so the mean of the two directions of a sweep is not its gravity load
    compensation:
      max_positions: 15
      terms: {constant: 3.728, wrist_pitch: -35.581}
    velocity_feedforward:  # 21 November 2026, run tune_joint5_20261121_2219
      max_positions: 30
      pwm_per_degree_per_second: 2.50
      pwm_for_friction: 13.2  # 23 November 2026, run tune_joint5_20261123_2300
  # an XC330-T288-T on the 12 V bus since 11 November 2026, in position mode since 18 November. The gripper is
  # mounted directly on its horn, so its zero needs no calibration
  6:
    name: wrist 3
    model: XC330-T288-T
    bus: ttl
    mode: position
    positions: [0, 4096]
    angles: [-180, 180]
    profile: {velocity: 200, acceleration: 50, move_time: 15}
    pid: {p: 1150, i: 0, d: 0}  # 18 November 2026
    # 23 November 2026, run tune_joint6_20261123_2301 (4.45 on 21 November). On this servo the measured pwm is half
    # of P / 128 times the error, so the value is the one fitted from the lag and its "pwm units" are twice the
    # real ones. No friction term: the fit gives none, and at 10 degrees/s the joint moves in a stick-slip way
    velocity_feedforward:
      max_positions: 30
      pwm_per_degree_per_second: 4.97
  # an XC330-T288-T on the 12 V bus since 11 November 2026. 0 is open and 100 is closed. The positions were read on
  # 25 November 2026 with the torque off: 1086 where the gripper was set open by hand, 2037 with the fingers
  # touching. The mechanical end on the open side is at 974, 112 positions (10 degrees) beyond the open position.
  # Under power at 60 mA (gripper_test --calibrate) it closed to 2038 and opened again to 1063: the last stretch to
  # the open end takes more than that. The grip, tested that day with gripper_test: closing empty it stops at 2032
  # with 11 mA, so it does not push against its closed end. On an object it holds the goal current whatever the
  # target is beyond it (150 mA at 10, 20 and 25 states). It draws no more than about 640 mA whatever the goal
  # current, and from 600 mA the supply at the servo sags from 11.5 to 10.6 V, so stay well below that. The squeeze
  # grows by 2.39 mA per position the target is beyond the object and is whole (150 mA) from about 65 positions
  # (gripper_test --measure-lead); the gamepad keeps its target within 85 (GRIPPER_MAX_LEAD_POSITIONS). Measure
  # that again when the goal current or the P gain changes
  7:
    name: gripper
    model: XC330-T288-T
    bus: ttl
    mode: current_based_position
    positions: [1086, 2037]
    states: [0, 100]
    goal_current: 150  # squeezes about as hard as the 400 mA of the XL330 did, the limit of the servo is 910 mA
    profile: {velocity: 50, acceleration: 50}
    pid: {p: 600, i: 0, d: 400}  # the bench gains of servo 6, not tuned on the arm
