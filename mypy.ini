[mypy]
python_version = 3.12
files = src, main.py
# every function has to be annotated, so the hints stay everywhere
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True

# libraries without type information
[mypy-pybullet.*,pybullet_data.*,dynamixel_sdk.*,tensorflow.*,tensorflow_probability.*,tf_agents.*,absl.*,gin.*,numba.*,jsonpickle.*,xacro.*,inputs.*,evdev.*,keyboard.*,imageio.*,hilbertcurve.*,flask_cdn.*,flask_cors.*,Arduino.*,scipy.*,mpl_toolkits.*]
ignore_missing_imports = True
